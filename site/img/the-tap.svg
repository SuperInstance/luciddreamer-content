<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0e"/>
      <stop offset="50%" stop-color="#111817"/>
      <stop offset="100%" stop-color="#0a0f0e"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#b87333" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#b87333" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2422" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0f0e" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Window -->
  <rect x="100" y="50" width="400" height="300" rx="4" fill="url(#window)" stroke="#1e2826" stroke-width="2"/>
  <line x1="300" y1="50" x2="300" y2="350" stroke="#1e2826" stroke-width="2"/>
  <line x1="100" y1="200" x2="500" y2="200" stroke="#1e2826" stroke-width="2"/>
  <!-- Rain streaks -->
  <g opacity="0.3" stroke="#3a5450" stroke-width="1">
    <line x1="150" y1="80" x2="140" y2="120"/>
    <line x1="200" y1="100" x2="190" y2="140"/>
    <line x1="250" y1="70" x2="240" y2="110"/>
    <line x1="350" y1="90" x2="340" y2="130"/>
    <line x1="400" y1="110" x2="390" y2="150"/>
    <line x1="450" y1="85" x2="440" y2="125"/>
    <line x1="180" y1="250" x2="170" y2="290"/>
    <line x1="380" y1="240" x2="370" y2="280"/>
    <line x1="430" y1="260" x2="420" y2="300"/>
  </g>
  
  <!-- Bar counter -->
  <rect x="0" y="450" width="1200" height="225" fill="#111817"/>
  <rect x="0" y="445" width="1200" height="8" fill="#1e2826"/>
  
  <!-- String lights -->
  <g opacity="0.6">
    <path d="M 50 30 Q 300 60 600 40 T 1150 30" stroke="#3a5450" stroke-width="1" fill="none"/>
    <circle cx="120" cy="42" r="4" fill="#d49156" opacity="0.8"/>
    <circle cx="250" cy="50" r="4" fill="#b87333" opacity="0.7"/>
    <circle cx="380" cy="48" r="4" fill="#d49156" opacity="0.9"/>
    <circle cx="500" cy="43" r="4" fill="#b87333" opacity="0.6"/>
    <circle cx="620" cy="42" r="4" fill="#d49156" opacity="0.8"/>
    <circle cx="750" cy="40" r="4" fill="#b87333" opacity="0.7"/>
    <circle cx="880" cy="38" r="4" fill="#d49156" opacity="0.9"/>
    <circle cx="1000" cy="35" r="4" fill="#b87333" opacity="0.6"/>
    <circle cx="1100" cy="32" r="4" fill="#d49156" opacity="0.8"/>
  </g>
  
  <!-- Bottles on shelf -->
  <g opacity="0.5">
    <rect x="700" y="180" width="20" height="80" rx="3" fill="#b87333" opacity="0.4"/>
    <rect x="730" y="170" width="22" height="90" rx="3" fill="#3a5450" opacity="0.5"/>
    <rect x="760" y="185" width="18" height="75" rx="3" fill="#c9a84c" opacity="0.3"/>
    <rect x="790" y="175" width="24" height="85" rx="3" fill="#5a9e8e" opacity="0.3"/>
    <rect x="825" y="190" width="20" height="70" rx="3" fill="#b87333" opacity="0.4"/>
    <rect x="855" y="180" width="22" height="80" rx="3" fill="#1a2422" opacity="0.6"/>
    <rect x="885" y="185" width="18" height="75" rx="3" fill="#3a5450" opacity="0.5"/>
    <rect x="915" y="170" width="24" height="90" rx="3" fill="#b87333" opacity="0.3"/>
  </g>
  
  <!-- Shelf -->
  <rect x="680" y="265" width="280" height="4" fill="#1e2826"/>
  <rect x="680" y="160" width="280" height="3" fill="#1e2826" opacity="0.5"/>
  
  <!-- Glasses on bar -->
  <g opacity="0.6">
    <!-- Glass 1 -->
    <ellipse cx="300" cy="460" rx="15" ry="4" fill="#2a3d3a"/>
    <path d="M 285 460 L 288 510 L 312 510 L 315 460 Z" fill="#2a3d3a" opacity="0.7" stroke="#3a5450" stroke-width="1"/>
    <ellipse cx="300" cy="480" rx="10" ry="3" fill="#b87333" opacity="0.4"/>
    
    <!-- Glass 2 -->
    <ellipse cx="550" cy="460" rx="18" ry="5" fill="#2a3d3a"/>
    <path d="M 532 460 L 535 505 L 565 505 L 568 460 Z" fill="#2a3d3a" opacity="0.7" stroke="#3a5450" stroke-width="1"/>
    
    <!-- Glass 3 (green - the salmonberry glass) -->
    <ellipse cx="800" cy="460" rx="16" ry="4" fill="#1a3a2a"/>
    <path d="M 784 460 L 787 508 L 813 508 L 816 460 Z" fill="#1a3a2a" opacity="0.8" stroke="#2a5a3a" stroke-width="1"/>
    <ellipse cx="800" cy="478" rx="11" ry="3" fill="#2a8a4a" opacity="0.5"/>
    
    <!-- Glass 4 -->
    <ellipse cx="950" cy="460" rx="15" ry="4" fill="#2a3d3a"/>
    <path d="M 935 460 L 938 505 L 962 505 L 965 460 Z" fill="#2a3d3a" opacity="0.7" stroke="#3a5450" stroke-width="1"/>
  </g>
  
  <!-- Copper glow overlay -->
  <rect width="1200" height="675" fill="url(#light)"/>
  
  <!-- Stools -->
  <g opacity="0.4">
    <rect x="250" y="550" width="40" height="3" fill="#3a5450"/>
    <rect x="258" y="553" width="3" height="40" fill="#3a5450"/>
    <rect x="279" y="553" width="3" height="40" fill="#3a5450"/>
    
    <rect x="500" y="550" width="40" height="3" fill="#3a5450"/>
    <rect x="508" y="553" width="3" height="40" fill="#3a5450"/>
    <rect x="529" y="553" width="3" height="40" fill="#3a5450"/>
    
    <rect x="750" y="550" width="40" height="3" fill="#3a5450"/>
    <rect x="758" y="553" width="3" height="40" fill="#3a5450"/>
    <rect x="779" y="553" width="3" height="40" fill="#3a5450"/>
    
    <rect x="900" y="550" width="40" height="3" fill="#3a5450"/>
    <rect x="908" y="553" width="3" height="40" fill="#3a5450"/>
    <rect x="929" y="553" width="3" height="40" fill="#3a5450"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="620" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="24" fill="#b87333" opacity="0.6" font-style="italic">
    The Tap
  </text>
</svg>
