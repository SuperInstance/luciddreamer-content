<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="ocean" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2422"/>
      <stop offset="60%" stop-color="#0a0f0e"/>
      <stop offset="100%" stop-color="#050807"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0f0e"/>
      <stop offset="35%" stop-color="#111817"/>
      <stop offset="50%" stop-color="#1a2422"/>
      <stop offset="65%" stop-color="#0d1513"/>
      <stop offset="100%" stop-color="#050807"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="675" fill="url(#horizon)"/>
  
  <!-- Moon -->
  <circle cx="950" cy="150" r="40" fill="#c9a84c" opacity="0.15"/>
  <circle cx="950" cy="150" r="28" fill="#d4b56c" opacity="0.25"/>
  <circle cx="950" cy="150" r="20" fill="#e0c478" opacity="0.3"/>
  
  <!-- Stars -->
  <g fill="#c4cfc9" opacity="0.4">
    <circle cx="100" cy="50" r="1"/>
    <circle cx="200" cy="80" r="1.5"/>
    <circle cx="350" cy="40" r="1"/>
    <circle cx="500" cy="90" r="1"/>
    <circle cx="650" cy="60" r="1.5"/>
    <circle cx="750" cy="100" r="1"/>
    <circle cx="1050" cy="70" r="1"/>
    <circle cx="1100" cy="120" r="1.5"/>
    <circle cx="150" cy="150" r="1"/>
    <circle cx="400" cy="130" r="1"/>
    <circle cx="600" cy="150" r="1"/>
    <circle cx="850" cy="90" r="1"/>
  </g>
  
  <!-- Horizon line -->
  <line x1="0" y1="340" x2="1200" y2="340" stroke="#1e2826" stroke-width="1" opacity="0.5"/>
  
  <!-- Water reflections -->
  <g opacity="0.15">
    <ellipse cx="950" cy="360" rx="3" ry="20" fill="#c9a84c"/>
    <ellipse cx="950" cy="400" rx="5" ry="30" fill="#c9a84c"/>
    <ellipse cx="950" cy="460" rx="8" ry="40" fill="#b87333"/>
    <ellipse cx="950" cy="530" rx="12" ry="50" fill="#8a5a2b"/>
    <ellipse cx="950" cy="600" rx="15" ry="40" fill="#5a3a1b"/>
  </g>
  
  <!-- Boat silhouette -->
  <g opacity="0.6" transform="translate(300, 330)">
    <!-- Hull -->
    <path d="M -80 0 L 80 0 L 60 25 L -60 25 Z" fill="#0a0f0e"/>
    <!-- Mast -->
    <line x1="0" y1="0" x2="0" y2="-80" stroke="#0a0f0e" stroke-width="3"/>
    <!-- Light at top -->
    <circle cx="0" cy="-80" r="3" fill="#b87333" opacity="0.6"/>
    <circle cx="0" cy="-80" r="6" fill="#b87333" opacity="0.2"/>
    <!-- Deck lights -->
    <rect x="-40" y="5" width="3" height="3" fill="#c9a84c" opacity="0.5"/>
    <rect x="20" y="5" width="3" height="3" fill="#b87333" opacity="0.4"/>
    <!-- Reflection in water -->
    <rect x="-40" y="28" width="3" height="20" fill="#c9a84c" opacity="0.1"/>
    <rect x="20" y="28" width="3" height="20" fill="#b87333" opacity="0.1"/>
  </g>
  
  <!-- Water ripples -->
  <g stroke="#2a3d3a" stroke-width="1" fill="none" opacity="0.3">
    <path d="M 100 400 Q 150 405 200 400"/>
    <path d="M 400 420 Q 450 425 500 420"/>
    <path d="M 600 380 Q 650 385 700 380"/>
    <path d="M 800 440 Q 850 445 900 440"/>
    <path d="M 200 500 Q 250 505 300 500"/>
    <path d="M 500 530 Q 550 535 600 530"/>
    <path d="M 800 560 Q 850 565 900 560"/>
    <path d="M 100 580 Q 150 585 200 580"/>
    <path d="M 300 600 Q 350 605 400 600"/>
    <path d="M 600 620 Q 650 625 700 620"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="650" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="20" fill="#b87333" opacity="0.4" font-style="italic">
    Southeast Alaska · The fishing families gather at 5 PM
  </text>
</svg>
